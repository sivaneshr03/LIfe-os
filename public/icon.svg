<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="lifeosLeafVert" x1="0.3" y1="0.0" x2="0.6" y2="1.0">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="25%" stop-color="#4ade80"/>
      <stop offset="65%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lifeosLeafHoriz" x1="0.0" y1="0.2" x2="1.0" y2="0.8">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="lifeosGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dark circular background badge -->
  <circle cx="256" cy="256" r="256" fill="#08090e"/>
  <circle cx="256" cy="256" r="254" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Glowing Modern L Petals -->
  <g filter="url(#lifeosGlow)">
    <!-- Vertical Leaf Stem -->
    <path d="M234 128 C234 128 140 188 140 286 C140 348 174 384 228 384 C272 384 278 338 278 300 C278 240 234 128 234 128 Z" fill="url(#lifeosLeafVert)"/>
    
    <!-- Horizontal Petal Wing -->
    <path d="M172 368 C220 300 280 278 362 278 C378 278 378 296 368 312 C320 376 250 384 172 368 Z" fill="url(#lifeosLeafHoriz)"/>
  </g>
</svg>
